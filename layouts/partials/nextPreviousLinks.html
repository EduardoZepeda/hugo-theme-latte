{{ $posts := where .Site.RegularPages "Type" "posts" }}
<nav aria-label="{{ i18n "nextAndPreviuosLinks"}}" class="next-prev-links">
    <!-- we should check whether Next and Prev exist before hand, otherwise pagination could create an uncrawlable link -->
    {{ with $posts.Next . }}
        <div class="next-link">
            <p><strong>←{{ i18n "next"}}</strong></p>
            <a title="{{ .Title }}" aria-label="{{ i18n "nextEntry"}}" class="next-prev" rel="next" href="{{ .RelPermalink }}">{{ .Title | truncate 50 "..."}}</a>
        </div>
    {{ end }}
    {{ with $posts.Prev . }}
        <div class="previous-link">
            <p><strong>{{ i18n "previous"}}→</strong></p>
            <a title="{{ .Title }}" aria-label="{{ i18n "previousEntry"}}" class="next-prev" rel="prev" href="{{ .RelPermalink }}">{{ .Title | truncate 50 "..." }}</a>
        </div>
    {{ end }}
</nav>
